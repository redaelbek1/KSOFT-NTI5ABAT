services:
  - type: web
    name: nti5abat-elections
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: KASOFT_PIN
        sync: false
      - key: ASSET_VERSION
        value: "20"
