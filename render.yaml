# Déploiement Render — connecter le repo GitHub puis « New Blueprint »
# https://dashboard.render.com/blueprints
databases:
  # La région doit être identique à celle du service web : le nom d'hôte
  # interne de la base n'est résolvable que dans la même région.
  - name: kasoft-db
    plan: free
    region: frankfurt
    databaseName: kasoft
    user: kasoft

services:
  - type: web
    name: nti5abat-elections
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: KASOFT_ADMIN_PIN
        sync: false
      - key: KASOFT_MOURAKIB_PIN
        sync: false
      - key: KASOFT_PHASE2
        value: "1"
      - key: ASSET_VERSION
        value: "51"
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kasoft-db
          property: connectionString
