# Déploiement Render — connecter le repo GitHub puis « New Blueprint »
# https://dashboard.render.com/blueprints
# La base PostgreSQL est hébergée chez Neon (gratuite et permanente, contrairement
# à la base gratuite de Render qui expire au bout de 30 jours). Son URL est saisie
# à la main dans le tableau de bord Render, via la variable DATABASE_URL.
services:
  - type: web
    name: nti5abat-elections
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: KASOFT_ADMIN_PIN
        sync: false
      - key: KASOFT_MOURAKIB_PIN
        sync: false
      - key: KASOFT_PHASE2
        value: "1"
      - key: ASSET_VERSION
        value: "51"
      - key: FLASK_DEBUG
        value: "0"
      # Saisi à la main dans le tableau de bord : on utilise l'URL EXTERNE de
      # la base, résolvable même si la base et le service ne sont pas dans la
      # même région (l'URL interne dpg-…-a ne l'est pas).
      - key: DATABASE_URL
        sync: false
