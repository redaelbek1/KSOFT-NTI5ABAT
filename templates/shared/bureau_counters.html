<!-- compteurs ملغاة + متنازع عليها -->
<section class="bureau-counters" id="bureau-counters">
    <div class="bureau-undo-frame">
        <button type="button" id="btn-counter-cancel" class="bureau-counter-btn bureau-counter-btn-cancel" data-i18n-title="cpt_counter_cancel_btn" title="تراجع آخر +">↩</button>
    </div>
    <div class="bureau-counter-card bureau-counter-cancel">
        <div class="bureau-counter-info">
            <span class="bureau-counter-label" data-i18n="cpt_counter_cancel">ملغاة</span>
            <span class="bureau-counter-value num" id="counter-cancel-value" lang="en-US" dir="ltr">0</span>
        </div>
        <button type="button" id="btn-counter-cancel-plus" class="bureau-counter-btn bureau-counter-btn-plus">+</button>
    </div>
    <div class="bureau-counter-card bureau-counter-neg">
        <div class="bureau-counter-info">
            <span class="bureau-counter-label" data-i18n="cpt_counter_negotiation">متنازع عليها</span>
            <span class="bureau-counter-value num" id="counter-negotiation-value" lang="en-US" dir="ltr">0</span>
        </div>
        <button type="button" id="btn-counter-negotiation" class="bureau-counter-btn bureau-counter-btn-plus">+</button>
    </div>
</section>
